name: Scheduled Ingest Trigger

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

jobs:
  trigger-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.INGEST_ENDPOINT }}" ]; then
            echo "INGEST_ENDPOINT secret is required."
            exit 1
          fi
          if [ -z "${{ secrets.INGEST_TOKEN }}" ]; then
            echo "INGEST_TOKEN secret is required."
            exit 1
          fi

      - name: Trigger remote ingest
        run: |
          curl --fail --show-error --silent \
            --request POST "${{ secrets.INGEST_ENDPOINT }}/ingest/run" \
            --header "x-ingest-token: ${{ secrets.INGEST_TOKEN }}" \
            --header "content-type: application/json"
